---
# Build and package the Linux amd64 Degoo vault distribution archive.
# The archive and its SHA-256 sidecar are produced by bin/package-degoo.py,
# uploaded as a workflow artifact, and attached to a GitHub release on tags.

name: degoo-package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: package-linux-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Release publishing on tag pushes needs write access to contents.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history keeps the packaging provenance (branch, commit) valid.
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Validate packaging tool
        run: python3 bin/package-degoo.py --self-check

      - name: Build rclone
        run: |
          mkdir -p build
          go build -o build/rclone .

      - name: Create distribution archive
        run: |
          python3 bin/package-degoo.py \
            --binary build/rclone \
            --output dist/rclone-degoo-linux-amd64.tar.gz

      - name: Verify archive checksum
        run: |
          cd dist
          sha256sum -c rclone-degoo-linux-amd64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rclone-degoo-linux-amd64
          path: |
            dist/rclone-degoo-linux-amd64.tar.gz
            dist/rclone-degoo-linux-amd64.tar.gz.sha256
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "rclone-degoo ${tag}" \
              --generate-notes
          fi
          gh release upload "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/rclone-degoo-linux-amd64.tar.gz \
            dist/rclone-degoo-linux-amd64.tar.gz.sha256
